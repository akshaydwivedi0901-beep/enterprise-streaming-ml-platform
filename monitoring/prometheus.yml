global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - 'alert_rules.yml'
  - 'recording_rules.yml'

scrape_configs:
  - job_name: 'consumer'
    static_configs:
      - targets: ['consumer:8000']
    scrape_interval: 10s
  - job_name: 'spark-master'
    static_configs:
      - targets: ['spark:8080']
    scrape_interval: 30s
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
