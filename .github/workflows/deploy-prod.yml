name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
        - prod

jobs:
  terraform-plan-prod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure/terraform/envs/prod

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: us-east-1

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.0"

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan -out=tfplan

  deploy-prod:
    runs-on: ubuntu-latest
    needs: terraform-plan-prod
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: us-east-1

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.0"

    - name: Terraform Apply Production
      working-directory: ./infrastructure/terraform/envs/prod
      run: terraform apply -auto-approve

    - name: Deploy Services to Production
      run: |
        # Update ECS services with new Docker images
        aws ecs update-service --cluster enterprise-prod-cluster --service consumer-service --force-new-deployment
        aws ecs update-service --cluster enterprise-prod-cluster --service producer-service --force-new-deployment
        aws ecs update-service --cluster enterprise-prod-cluster --service ml-training-service --force-new-deployment

    - name: Run Smoke Tests
      run: |
        # Run smoke tests against production
        echo "Running smoke tests..."
        # Add actual smoke test commands here

    - name: Notify on Success
      if: success()
      run: |
        echo "Production deployment successful!"
        # Add notification logic (Slack, email, etc.)

    - name: Rollback on Failure
      if: failure()
      run: |
        echo "Production deployment failed, initiating rollback..."
        # Add rollback logic here