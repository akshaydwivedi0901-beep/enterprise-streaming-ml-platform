name: ML Model Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/ml/**'
      - 'services/ml_training/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/ml/**'
      - 'services/ml_training/**'

jobs:
  ml-validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install scikit-learn pandas numpy pytest

    - name: Run ML model tests
      run: |
        pytest services/ml/ services/ml_training/ -v

    - name: Validate model performance
      run: |
        python -c "
        import sys
        sys.path.append('services/ml')
        from train_model import validate_model
        # Add model validation logic
        print('Model validation completed')
        "

    - name: Check model drift
      run: |
        # Add model drift detection logic
        echo 'Checking for model drift...'

  ml-model-registry:
    runs-on: ubuntu-latest
    needs: ml-validation
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install MLflow
      run: pip install mlflow

    - name: Register model in MLflow
      run: |
        # Configure MLflow tracking URI
        export MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}

        # Register new model version
        python -c "
        import mlflow
        import mlflow.sklearn
        from services.ml.train_model import load_model

        with mlflow.start_run():
            model = load_model()
            mlflow.sklearn.log_model(model, 'model')
            print('Model registered in MLflow')
        "

    - name: Update model in production
      run: |
        # Logic to update model in production services
        echo 'Model updated in production'

  performance-monitoring:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up monitoring
      run: |
        # Set up performance monitoring
        echo 'Setting up performance monitoring...'

    - name: Run performance tests
      run: |
        # Run performance benchmarks
        echo 'Running performance tests...'

    - name: Generate performance report
      run: |
        # Generate and store performance metrics
        echo 'Performance report generated'