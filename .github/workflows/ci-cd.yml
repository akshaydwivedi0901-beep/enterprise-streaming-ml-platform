name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r services/consumer/requirements.txt
          pip install pytest pytest-cov flake8
      
      - name: Lint code
        run: |
          flake8 services/consumer/consumer.py --max-line-length=120 --ignore=E203,W503
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=services/consumer || true
