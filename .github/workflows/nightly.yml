name: Nightly Integration Tests

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      kafka:
        image: confluentinc/cp-kafka:7.0.1
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.0.1
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_SYNC_LIMIT: 2
          ZOOKEEPER_INIT_LIMIT: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for services
      run: |
        # Wait for Kafka to be ready
        for i in {1..30}; do
          if kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done

    - name: Run integration tests
      run: |
        # Run end-to-end tests
        python -m pytest tests/integration/ -v --tb=short

    - name: Test data pipeline
      run: |
        # Test producer -> Kafka -> consumer flow
        python services/producer/producer.py &
        PRODUCER_PID=$!

        sleep 5

        python services/consumer/consumer.py &
        CONSUMER_PID=$!

        sleep 10

        # Send test messages
        echo "Testing data pipeline..."

        # Clean up
        kill $PRODUCER_PID $CONSUMER_PID

    - name: Generate test report
      run: |
        # Generate integration test report
        echo "Integration tests completed"

  performance-test:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust

    - name: Run performance tests
      run: |
        # Run load testing
        locust --headless --users 100 --spawn-rate 10 --run-time 1m --host http://localhost:8000

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: performance_results/

  cleanup:
    runs-on: ubuntu-latest
    needs: [integration-test, performance-test]
    if: always()

    steps:
    - name: Clean up resources
      run: |
        # Clean up any test resources
        echo "Cleaning up test resources..."

    - name: Notify on failure
      if: failure()
      run: |
        echo "Nightly integration tests failed"
        # Add notification logic here